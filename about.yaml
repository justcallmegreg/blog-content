# About page content for the blog engine. Company names are intentionally
# anonymized to role + scale; only the role, essence and impact are shown.
headline: "Greg Nagy — cloud, Kubernetes & platform engineering leader"

bio: >-
  Engineering is a method: define, research, design, build, measure, iterate.
  For a decade I've led cloud adoption, Kubernetes and containerization — from
  writing infrastructure-as-code before managed Kubernetes existed, to building
  and leading a containerization practice serving enterprises across Europe. I
  build platforms that make application delivery simple, and the teams that keep
  them running. Based in the Netherlands, at home across every major hyperscaler.

