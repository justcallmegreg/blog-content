    description: "Practice Lead — a European cloud-native consultancy. Spearheaded the containerization business line, driving Kubernetes adoption for mid- to enterprise-scale companies across Europe."
    responsibilities: "Owned the strategy, offering and delivery for containerization; built and led a team from the ground up to a dozen specialists delivering professional and managed services."
    deliveries: "Standardized a repeatable containerization offering that positioned the firm as a market leader; delivered greenfield and brownfield projects across all major hyperscalers (EKS, AKS, GKE, OpenShift, Rancher), from presales through delivery management."

