    deliveries: "Cut operational cost and shortened the time to launch new products, while keeping the fleet reliable across very different global conditions."

  - start: 2015
    end: 2016
    description: "Head of Software Development — an ed-tech robotics startup. Owned software delivery and infrastructure for a programmable robot that teaches children to code."
