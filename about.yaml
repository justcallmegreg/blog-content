# About page content for the blog engine. Company names are intentionally
# anonymized to role + scale; only the role, essence and impact are shown.
headline: "Greg Nagy — hands-on engineering leader: cloud, containerization & automation"

bio: >-
  Engineering is a method — define, research, design, build, measure, iterate —
  and at the end it's applied science, not a memorized list of tools. Over a
  decade I've worked across on-prem data centers and every major hyperscaler,
  but what I trust is the approach: containerization and automation over one-off
  fixes, methodologies over product names. I stay hands-on — I can design and
  build the platform myself — while holding the wider picture: setting the goal,
  shaping the execution plan, and owning its delivery. I build systems that make
  software delivery simple, and I build and lead the teams that run them.

projects:
  - start: 2025
    end: 2026
    description: "Consultant — a leading technology consultancy. Helping enterprises transform how they build and run software, pairing hands-on engineering with the strategy, goals and execution planning that make a transformation actually land."

  - start: 2024
    end: 2026
    description: "Founder — an independent IT consulting & services practice. Taking client transformations end to end: defining the goal, designing the approach, and doing the hands-on build myself alongside a small workshop of trusted experts."

  - start: 2020
    end: 2023
    description: "Practice Lead — a European cloud-native consultancy. Built and ran the containerization practice from the ground up, turning a repeatable, automation-first method into the firm's market-leading offering."
    responsibilities: "Owned the practice end to end — strategy, offering, hiring and delivery — while staying technical: I set the goals and the execution plan, then worked alongside the team on the hard problems. Grew it from zero to a dozen specialists delivering professional and managed services."
    deliveries: "Standardized a repeatable containerization-and-automation method that worked across every major hyperscaler and self-managed platform; delivered greenfield and brownfield projects from presales through delivery management, consistently ahead of competitors."

  - start: 2018
    end: 2020
    description: "Team Lead — the Netherlands practice of that European cloud-native consultancy. Grew the technical team across AWS and GCP while staying hands-on in delivery."
    responsibilities: "Managed hiring, mentoring and team development, backed presales with real technical depth, and oversaw projects from sale to delivery — defining scope and plan, then helping execute them."
    deliveries: "Helped double the size of the local branch, growing both the team and its delivery capability, and trained cloud architects and engineers to a consistent, method-driven standard."

  - start: 2018
    end: 2018
    description: "Cloud Architect — an enterprise industrial software company. Led the move to a container-based platform, hands-on with the product teams to make it real."
    responsibilities: "Worked directly with product development to make their applications platform-ready, and defined the foundation the whole company would build on."
    deliveries: "Designed and built a dependable landing zone that gave the company a simple, repeatable path from code to running software."

  - start: 2016
    end: 2018
    description: "DevOps Engineer — one of the world's largest blog media companies. Moved the company off its own data centers and onto the cloud, infrastructure-as-code first, before managed container platforms existed."
    responsibilities: "Designed and built the cloud landing zone by hand with infrastructure-as-code, and partnered with developers to make their applications cloud- and container-native."
    deliveries: "Delivered the data-center-to-cloud migration and hand-rolled container-cluster provisioning on CoreOS — proof that the method mattered more than any off-the-shelf service."

  - start: 2016
    end: 2016
